[package]
name = "lumendisk-core"
version = "1.0.3"
edition = "2021"
description = "LumenDisk user-space filesystem engine (ext2/3/4, FAT12/16/32, exFAT, NTFS) with NFSv3 loopback bridge"
license = "GPL-3.0-or-later"

[lib]
name = "lumendisk_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumendisk"
path = "src/bin/lumendisk.rs"

[dependencies]
nfsserve = { path = "../vendor/nfsserve" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
async-trait = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = [] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
tiny_http = "0.12"
# TLS for the LAN server (lan/tls.rs). Must stay the same rustls major as ureq's (0.23) so
# `ureq::AgentBuilder::tls_config` accepts our ClientConfig; `ring` provider only (no aws-lc-rs/cmake).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
quick-xml = "0.36"
base64 = "0.22"
sha2 = "0.10"
# Forge: OS CSPRNG for crypt salts and wipe keys (already in the tree through uuid), and a fast
# reproducible ChaCha20 keystream for random wipe passes (regenerated to verify the last pass).
getrandom = "0.2"
rand_chacha = "0.3"
httpdate = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
libc = "0.2"
