[package]
name = "lumendisk-core"
version = "1.1.0"
edition = "2021"
description = "LumenDisk user-space filesystem engine (ext2/3/4, FAT12/16/32, exFAT, NTFS) with NFSv3 loopback bridge"
license = "GPL-3.0-or-later"

[lib]
name = "lumendisk_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumendisk"
path = "src/bin/lumendisk.rs"

[dependencies]
nfsserve = { path = "../vendor/nfsserve" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
async-trait = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = [] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
tiny_http = "0.12"
# TLS for the LAN server (lan/tls.rs). Must stay the same rustls major as ureq's (0.23) so
# `ureq::AgentBuilder::tls_config` accepts our ClientConfig; `ring` provider only (no aws-lc-rs/cmake).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
quick-xml = "0.36"
base64 = "0.22"
sha2 = "0.10"
# Forge: OS CSPRNG for crypt salts and wipe keys (already in the tree through uuid), and a fast
# reproducible ChaCha20 keystream for random wipe passes (regenerated to verify the last pass).
getrandom = "0.2"
rand_chacha = "0.3"
httpdate = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# Forge source images (forge/image.rs), all pure Rust (no C toolchain, no system libraries):
# gzip / zip deflate / DMG zlib (miniz_oxide backend), XZ / DMG LZMA (no encoder in the app),
# bzip2 (libbz2-rs-sys, the Rust port of libbzip2), zstd (decoder only), DMG LZFSE,
# CRC-32 for ZIP and XZ index records.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "optimization"] }
bzip2 = "0.6"
ruzstd = { version = "0.9", default-features = false, features = ["std", "hash"] }
lzfse_rust = "0.2"
crc32fast = "1"
# Forge checksums (forge/hash.rs, forge/flash.rs): the `digest` 0.11 family, whose SHA-256 and
# SHA-1 use the ARMv8 SHA instructions when the CPU has them (runtime detection, no assembly
# to build); sha2 0.10 above is software-only on Apple silicon (≈ 5× slower). sha2 0.11 is
# already in the build through lzma-rust2.
sha2_hw = { package = "sha2", version = "0.11" }
sha1 = "0.11"
md-5 = "0.11"

[dev-dependencies]
libc = "0.2"
# Tests build XZ images (the app itself only decodes).
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "optimization", "encoder"] }
