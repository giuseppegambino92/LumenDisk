[package]
name = "lumendisk-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lumendisk-core = { path = ".." }

# Not part of the main workspace: built only by `cargo +nightly fuzz` (scripts/fuzz.sh).
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "ext4"
path = "fuzz_targets/ext4.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntfs"
path = "fuzz_targets/ntfs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fat"
path = "fuzz_targets/fat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exfat"
path = "fuzz_targets/exfat.rs"
test = false
doc = false
bench = false
