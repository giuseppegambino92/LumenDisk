# Build + every test that runs on a stock macOS runner. The end-to-end suites need Docker,
# real NFS mounts, attached disk images and an SSH/WebDAV server: they run locally with
# scripts/build_and_verify.sh (see README, "Verification").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode on the runner
        run: |
          XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build and verify (no Docker, no fuzzing)
        env:
          SKIP_E2E: "1"
          SKIP_FUZZ: "1"
        run: scripts/build_and_verify.sh
